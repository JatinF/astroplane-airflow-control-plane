[project]
name = "astroplane-airflow-control-plane"
version = "0.1.0"
description = "Self-contained Airflow control-plane reference with a Kubernetes operator reconciler, component provisioning, an Airflow-compatible API, zero-egress installation checks, offline supply-chain packaging, and operational metrics."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Jatinder Singh" }]
dependencies = [
  "fastapi==0.128.1",
  "httpx==0.27.2",
  "pydantic>=2",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]
